<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing page (offline fixture)</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 24px; color: #0b0b0b; background: #fff; }
  h1 { font-size: 20px; font-weight: 800; }
  p { color: #5b5b66; line-height: 1.5; }
  button { display: block; width: 100%; margin: 12px 0; padding: 14px; font-size: 16px; border-radius: 7px;
           border: 1px solid #121ab0; background: #fff; color: #121ab0; }
  button.primary { background: #121ab0; color: #fff; }
  .panel { display: none; padding: 16px; border: 1px solid #e6e6ea; border-radius: 7px; margin-top: 16px; }
</style>
</head>
<body>
<h1>Offline fixture</h1>
<p>This page imitates the direct signing page. Signing reveals the completion panel and then returns to the
  configured return URL with the status, as the real page does.</p>
<button class="primary" id="sign">Sign</button>
<button id="decline">Decline</button>
<div class="panel" id="sign-ok">Signed.</div>
<div class="panel" id="decline-ok">Declined.</div>
<script>
  function finish(panel, status) {
    document.getElementById(panel).style.display = 'block';
    setTimeout(function () {
      location.href = 'https://example.com/signing/done?session_id=sr_demo&signer_id=sgr_demo&status=' + status;
    }, 1500);
  }
  document.getElementById('sign').onclick = function () { finish('sign-ok', 'completed'); };
  document.getElementById('decline').onclick = function () { finish('decline-ok', 'declined'); };
</script>
</body>
</html>
