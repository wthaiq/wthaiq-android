name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, API check, assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        run: ./gradlew lint
      - name: detekt
        run: ./gradlew detekt
      - name: Public API check
        run: ./gradlew apiCheck
      - name: Assemble libraries and sample
        run: ./gradlew assembleRelease assembleDebug
      - name: Stage the Maven publication (local directory only)
        run: ./gradlew publishAllPublicationsToStagingRepository
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: |
            wthaiq-signing/build/outputs/aar/*-release.aar
            wthaiq-signing-compose/build/outputs/aar/*-release.aar
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator, API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK (pinned command-line tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          cmdline-tools-version: 11076708
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ./gradlew :wthaiq-signing:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-results
          path: wthaiq-signing/build/outputs/androidTest-results/
          retention-days: 7
